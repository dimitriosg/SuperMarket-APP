name: ci

on:
  pull_request:
  push:
    branches:
      - adjustments-190126

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Shared typecheck
        run: bun run --cwd packages/shared typecheck

      - name: Web build
        run: bun run --cwd apps/web build
